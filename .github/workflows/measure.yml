name: measure
# Pulls a published /opt/target image cold, changes one comment in op_kernel.h and times the rebuild,
# with the disk and memory it used, as build.yml's rebuild job does after a build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag to measure
        default: opt-target-c6c22eb
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/onnxruntime-1.31.0-cuda-sm90
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/lib/node_modules
          docker system prune -af > /dev/null
          df -h /
      - name: Pull cold
        run: |
          tag="$IMAGE:${{ inputs.tag }}"
          start=$(date +%s)
          docker pull -q "$tag"
          echo "PULL_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Rebuild after a comment change in op_kernel.h
        run: |
          start=$(date +%s)
          docker run -d --name rebuild-measure --user runner "$TAG" bash -c '
            set -e
            cd /opt/target
            printf "\n// measurement only: a comment that changes nothing\n" >> include/onnxruntime/core/framework/op_kernel.h
            du -sm /opt/ort-build | cut -f1 > /tmp/build_mb_before
            cmake --build /opt/ort-build/Release --config Release --parallel 4 > /tmp/rebuild.log 2>&1
            grep -c "^\[" /tmp/rebuild.log > /tmp/steps || true
            du -sm /opt/ort-build | cut -f1 > /tmp/build_mb_after'
          peak=0
          while [ "$(docker inspect -f '{{.State.Running}}' rebuild-measure)" = true ]; do
            mem=$(docker stats --no-stream --format '{{.MemUsage}}' rebuild-measure | awk '{print $1}')
            mib=$(python3 -c "import sys,re; v=sys.argv[1]; n=float(re.sub(r'[^0-9.]','',v)); u=re.sub(r'[0-9.]','',v); print(int(n*{'B':2**-20,'KiB':2**-10,'MiB':1,'GiB':1024}.get(u,1)))" "$mem")
            [ "$mib" -gt "$peak" ] && peak=$mib
            sleep 15
          done
          code=$(docker inspect -f '{{.State.ExitCode}}' rebuild-measure)
          secs=$(( $(date +%s) - start ))
          docker cp rebuild-measure:/tmp/rebuild.log rebuild.log || true
          tail -n 5 rebuild.log || true
          before=$(docker cp rebuild-measure:/tmp/build_mb_before - 2>/dev/null | tar -xO || echo "?")
          after=$(docker cp rebuild-measure:/tmp/build_mb_after - 2>/dev/null | tar -xO || echo "?")
          steps=$(docker cp rebuild-measure:/tmp/steps - 2>/dev/null | tar -xO || echo "?")
          layer=$(docker ps -as --filter name=rebuild-measure --format '{{.Size}}')
          {
            echo "### rebuild after the op_kernel.h comment, 4 jobs on this runner's $(nproc --all) CPUs"
            echo "- exit code: $code, steps: $steps, wall time: $secs s"
            echo "- cold pull of the /opt/target image: ${PULL_S} s"
            echo "- /opt/ort-build: ${before} MB before, ${after} MB after; container writable layer: $layer"
            echo "- peak container memory: ${peak} MiB (sampled every 15 s)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$code" = 0
